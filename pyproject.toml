[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratory-database-integrity"
version = "0.1.0"
description = "Controlled initialization for a laboratory management database"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyMySQL==1.1.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
]

[project.scripts]
labdb = "labdb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly supplied disposable MySQL database",
]
